<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Видеовстречи</title>
  <link rel="icon" href="/icons/video.svg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="glow">
<div class="center-page">
  <form class="card glass stack" style="max-width:440px;width:100%;padding:30px" id="f">
    <div class="logo"><span class="mark"><i data-ic="video"></i></span>Встречи</div>
    <div><h1 style="margin:0">Подключиться к встрече</h1><div class="muted">Введите код встречи или вставьте ссылку-приглашение</div></div>
    <input id="code" placeholder="abc-defg-hij" autofocus class="mono" style="font-size:16px;padding:13px 14px">
    <button class="btn primary lg block"><i data-ic="log-in"></i>Подключиться</button>
    <div class="small" style="text-align:center"><a href="/admin">Вход для организатора</a></div>
  </form>
</div>
<script src="/js/common.js"></script>
<script>
$('#f').onsubmit = (e) => {
  e.preventDefault();
  let v = $('#code').value.trim();
  if (!v) return;
  const m = v.match(/\/r\/([^/?#]+)/);
  if (m) v = m[1];
  location.href = '/r/' + encodeURIComponent(v.toLowerCase());
};
</script>
</body>
</html>
